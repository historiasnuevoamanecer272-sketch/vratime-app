server {
    listen 80;
    listen [::]:80;

    server_name vratime.vzdigital.online;

    root /www/wwwroot/vratime.vzdigital.online/current;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://vratime.vzdigital.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name vratime.vzdigital.online;

    ssl_certificate /etc/letsencrypt/live/vratime.vzdigital.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vratime.vzdigital.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/wwwroot/vratime.vzdigital.online/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
