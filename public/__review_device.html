<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VratiMe — проверка опубликованной версии</title>
<style>body{margin:0;background:#eaf2ef;color:#164e53;font:14px system-ui}header{padding:12px;position:sticky;top:0;background:#fff;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select,input{font:inherit;padding:8px;border:1px solid #98b5ad;border-radius:8px}button{cursor:pointer}main{padding:16px;display:grid;justify-items:center;gap:10px}iframe{border:1px solid #91aaa7;background:#fff;flex:none;box-shadow:0 8px 30px #164e5320}p{margin:0;font-size:12px}details{max-width:100%}input{max-width:280px}</style>
<header><strong>Опубликованный VratiMe</strong><select aria-label="Размер экрана" id="size"><option value="390,844">iPhone ·390×844</option><option value="375,667">iPhone SE ·375×667</option><option value="430,932">iPhone Max ·430×932</option><option value="360,800">Android компактный ·360×800</option><option value="412,915">Android большой ·412×915</option><option value="320,700">Узкий экран ·320×700</option><option value="768,1024">Планшет ·768×1024</option></select><button id="home">Главная</button><details><summary>Войти временным тестовым пользователем</summary><form id="link"><input type="password" aria-label="Одноразовая ссылка тестового пользователя" autocomplete="off"><button>Открыть ссылку</button></form></details></header>
<main><p>Настоящий опубликованный сайт в окне заданного CSS-размера. Это проверка адаптивной вёрстки, а не физическое устройство.</p><iframe title="Опубликованный VratiMe" id="app" credentialless src="https://vratime.vzdigital.online/" width="390" height="844" allow="geolocation"></iframe></main>
<script>const frame=document.querySelector('#app');document.querySelector('#size').addEventListener('change',e=>{const[w,h]=e.target.value.split(',');frame.width=w;frame.height=h});document.querySelector('#home').onclick=()=>frame.src='https://vratime.vzdigital.online/';document.querySelector('#link').onsubmit=e=>{e.preventDefault();const input=e.target.querySelector('input');try{const url=new URL(input.value);if(!['https://kuoflaaankpjksyssfka.supabase.co','https://vratime.vzdigital.online'].includes(url.origin))throw Error();frame.src=url.href;input.value='';e.target.closest('details').open=false}catch{input.setCustomValidity('Допустима только ссылка нашего VratiMe');input.reportValidity()}};</script></html>
